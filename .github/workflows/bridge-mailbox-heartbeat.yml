name: Bridge Mailbox Heartbeat
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify bridge authority and mailboxes
        run: |
          set -euo pipefail
          git ls-remote https://github.com/One-Wave-Universe/Bridge-Comand.git refs/heads/main
          git ls-remote https://github.com/One-Wave-Universe/One-Wave-Science.git refs/heads/chatgpt-terminal refs/heads/chatgpt-terminal-backup
          python3 - <<'PY'
          import json, urllib.request
          base="https://raw.githubusercontent.com/One-Wave-Universe/One-Wave-Science"
          for branch in ("chatgpt-terminal","chatgpt-terminal-backup"):
              def get(name):
                  try:
                      with urllib.request.urlopen(f"{base}/{branch}/.chatgpt-terminal/{name}.json",timeout=10) as r:
                          return json.load(r)
                  except Exception:
                      return {}
              request=get("request"); result=get("result")
              req=request.get("id",""); res=result.get("id","")
              state="MACHINE_RECEIPT_MATCHED" if req and req==res else "MACHINE_RECEIPT_PENDING"
              print(f"{branch} request={req} result={res} {state}")
          print("BRIDGE_MAILBOX_EXTERNAL_ANCHOR_OK")
          PY

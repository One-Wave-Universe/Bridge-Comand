# Dell user-service drop-in: one-wave-deepseek-web-relay.service.d
# Browser profile scratch uses the authorized, mounted ModelStorage drive.
# Verified filesystem UUID: 8957fb87-c8e9-4bfb-846f-edcc9474bfd3
# Create browser-tmp as owner scales with mode 0700 before starting.
[Unit]
ConditionPathIsMountPoint=/run/media/scales/ModelStorage
[Service]
Environment=TMPDIR=/run/media/scales/ModelStorage/RepoLens/browser-tmp
ExecStartPre=/usr/bin/test -w /run/media/scales/ModelStorage/RepoLens/browser-tmp

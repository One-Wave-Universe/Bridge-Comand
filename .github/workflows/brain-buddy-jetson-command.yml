name: Brain Buddy Jetson Command Receipt
on:
  push:
    paths:
      - ".jetson-dispatch/request-*.json"
permissions:
  contents: write
concurrency:
  group: brain-buddy-jetson-command
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GATEWAY_URL: ${{ secrets.JETSON_GATEWAY_URL }}
      GATEWAY_TOKEN: ${{ secrets.JETSON_GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Dispatch bounded Jetson command
        shell: bash
        run: |
          set -euo pipefail
          P="$(git diff --name-only HEAD^ HEAD -- '.jetson-dispatch/request-*.json' | tail -n1)"
          test -n "$P"
          export REQUEST_PATH="$P"
          python3 - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error
          q=json.loads(pathlib.Path(os.environ["REQUEST_PATH"]).read_text()); rid=q["id"]
          out={"schema":"one-wave-jetson-command-receipt/v1","request_id":rid,"ok":False}
          url=os.environ.get("GATEWAY_URL","").strip(); token=os.environ.get("GATEWAY_TOKEN","").strip()
          if not url or not token:
              out.update(error_code="JETSON_GATEWAY_SECRET_MISSING")
          else:
              payload={"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"terminal_run","arguments":{
                "argv":q["argv"],"cwd":q["cwd"],"timeout":q.get("timeout",180),
                "intention":q["intention"],"consequence":q["consequence"]}}}
              try:
                  r=urllib.request.Request(url.rstrip("/")+"/mcp",data=json.dumps(payload).encode(),
                    headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},method="POST")
                  with urllib.request.urlopen(r,timeout=q.get("timeout",180)+15) as x: env=json.load(x)
                  if "error" in env: out.update(error_code="MCP_ERROR",error=env["error"])
                  else:
                      result=env.get("result",{}).get("structuredContent",{})
                      out.update(ok=bool(result.get("ok")),exit_code=result.get("exit_code"),
                        stdout=result.get("stdout",""),stderr=result.get("stderr",""),
                        command_error=result.get("error"),cwd=result.get("cwd"))
              except Exception as e:
                  out.update(error_code="JETSON_GATEWAY_CALL_FAILED",error=str(e)[:1500])
          dest=pathlib.Path("External_Work/brain_buddy/receipts")/(rid+".json")
          dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Commit receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name brain-buddy-receipt-bot
          git config user.email actions@users.noreply.github.com
          git add External_Work/brain_buddy/receipts/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: Brain Buddy Jetson command"
          git push

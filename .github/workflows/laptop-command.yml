name: Laptop Command Relay
on:
  push:
    paths:
      - ".laptop-dispatch/request.json"
  workflow_dispatch:
    inputs:
      request_json:
        description: "JSON: id, argv, cwd, timeout, intention, consequence"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: laptop-command-relay
  cancel-in-progress: false
jobs:
  command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GATEWAY_URL: ${{ secrets.JETSON_GATEWAY_URL }}
      GATEWAY_TOKEN: ${{ secrets.JETSON_GATEWAY_TOKEN }}
      REQUEST_JSON: ${{ inputs.request_json }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Issue laptop command and read signed return
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          q = json.loads(Path(".laptop-dispatch/request.json").read_text() if os.environ["EVENT_NAME"] == "push" else os.environ["REQUEST_JSON"])
          for field in ("id", "argv", "intention", "consequence"):
              if not q.get(field):
                  raise SystemExit("Missing required field: " + field)
          if q.get("artifact_delivery"):
              import base64
              data=Path(".laptop-dispatch/Circuit_Builder_Run.cjs.gz").read_bytes()
              encoded=base64.b64encode(data).decode()
              chunks=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for offset in range(0,len(chunks),100):
                  code="import pathlib,base64,sys;p=pathlib.Path('/home/Scales/.cache/one-wave-circuit-transfer');p.mkdir(parents=True,exist_ok=True);f=p/'runner.gz';f.open(sys.argv[1]).write(base64.b64decode(''.join(sys.argv[2:])))"
                  args={"argv":["python3","-c",code,"wb" if offset==0 else "ab"]+chunks[offset:offset+100],"cwd":"/home/Scales/One-Wave-Science","timeout":30,"intention":"Transfer the generated circuit runtime in bounded chunks","consequence":"Write only the temporary app artifact"}
                  payload={"jsonrpc":"2.0","id":8,"method":"tools/call","params":{"name":"terminal_run","arguments":args}}
                  req=urllib.request.Request(os.environ["GATEWAY_URL"].rstrip("/")+"/mcp",data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["GATEWAY_TOKEN"],"Content-Type":"application/json"})
                  with urllib.request.urlopen(req,timeout=50) as response: result=json.load(response).get("result",{}).get("structuredContent",{})
                  if result.get("exit_code")!=0: raise SystemExit("Artifact transfer failed: "+result.get("stderr",""))
              prep_argv = ["python3", "-c", "import pathlib,json,subprocess,base64,socket,urllib.parse,os\nsha='f372c796f0931cf5597d9948f929c28af3c4bf92'\np=pathlib.Path('/home/Scales/.cache/one-wave-circuit-transfer');f=p/'runner.gz'\nassert f.is_file(),'Artifact transfer missing'\nroute=json.loads((pathlib.Path.home()/'.config/one-wave-laptop-relay/route.json').read_text())\nhost=urllib.parse.urlparse(route['url']).hostname;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.connect((host,8766));ip=s.getsockname()[0];s.close()\nchild=\"from http.server import HTTPServer,BaseHTTPRequestHandler;from pathlib import Path;import os\\nclass H(BaseHTTPRequestHandler):\\n def do_GET(self):\\n  if self.path!='/\"+sha+\"':self.send_error(404);return\\n  b=Path('\"+str(f)+\"').read_bytes();self.send_response(200);self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)\\n def log_message(self,*a):pass\\nh=HTTPServer(('\"+ip+\"',8767),H);h.timeout=90;h.handle_request();os.unlink('\"+str(f)+\"')\"\nq=subprocess.Popen(['python3','-c',child],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)\nprint(json.dumps({'url':'http://'+ip+':8767/'+sha,'pid':q.pid}))\n"]
              payload = {"jsonrpc": "2.0", "id": 9, "method": "tools/call", "params": {"name": "terminal_run", "arguments": {"argv": prep_argv, "cwd": "/home/Scales/One-Wave-Science", "timeout": 60, "intention": "Stage the checksum-pinned circuit app for its authorized laptop installation", "consequence": "Return one temporary LAN artifact URL without exposing credentials"}}}
              req = urllib.request.Request(os.environ["GATEWAY_URL"].rstrip("/")+"/mcp", data=json.dumps(payload).encode(), headers={"Authorization":"Bearer "+os.environ["GATEWAY_TOKEN"],"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=80) as response: prepared=json.load(response).get("result",{}).get("structuredContent",{})
              if prepared.get("exit_code") != 0: raise SystemExit("Artifact staging failed: "+prepared.get("stderr",""))
              artifact=json.loads(prepared["stdout"])
              q["argv"][2]=q["argv"][2].replace("__ARTIFACT_URL__",artifact["url"])
              q.pop("artifact_delivery",None)
          q.setdefault("cwd", "/home/scales")
          q.setdefault("timeout", 30)
          q["target"] = "scales-Latitude-E7450"
          q.pop("issued_at", None)
          body = json.dumps(q, separators=(",", ":"))
          if len(body) > 4096:
              raise SystemExit("Request exceeds the upstream argv limit")
          url, token = os.environ["GATEWAY_URL"], os.environ["GATEWAY_TOKEN"]
          if not url or not token:
              raise SystemExit("Configure Jetson gateway secrets in Bridge-Comand")
          arguments = {
              "argv": ["python3", "/home/Scales/.local/state/signed_laptop_relay.py", "client", "--request-json", body],
              "cwd": "/home/Scales/One-Wave-Science",
              "timeout": min(300, int(q["timeout"]) + 30),
              "intention": q["intention"],
              "consequence": q["consequence"]
          }
          payload = {"jsonrpc": "2.0", "id": 1, "method": "tools/call",
                     "params": {"name": "terminal_run", "arguments": arguments}}
          req = urllib.request.Request(url.rstrip("/") + "/mcp", data=json.dumps(payload).encode(),
                    headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=330) as response:
              env = json.load(response)
          result = env.get("result", {}).get("structuredContent", {})
          if result.get("exit_code") != 0:
              print(result.get("stderr", ""))
              print(result.get("stdout", ""))
              raise SystemExit("Laptop relay command failed; reconcile this request id before retry")
          receipt = json.loads(result["stdout"])
          if receipt.get("id") != q["id"] or receipt.get("target") != q["target"] or receipt.get("exit_code") != 0:
              raise SystemExit("Laptop receipt mismatch or command failure")
          print(json.dumps(receipt, indent=2))
          print("LAPTOP_COMMAND_RECEIPT_VERIFIED")
          PY

name: Jetson AI Access Validate

on:
  push:
    paths:
      - 'JETSON_AI_ACCESS.md'
      - 'AI_BRIDGE_START_HERE.md'
      - 'AI_JETSON_TOOL_GUIDE.md'
      - 'External_Work/**'
      - 'hive-pipe/**'
      - 'scripts/install_jetson_gateway.sh'
      - 'scripts/enable_jetson_ssh.sh'
      - 'scripts/jetson_remote.sh'
      - 'scripts/external_work_bridge.py'
      - '.github/workflows/jetson-command.yml'
      - '.github/workflows/jetson-ai-access-validate.yml'
  pull_request:
    paths:
      - 'JETSON_AI_ACCESS.md'
      - 'AI_BRIDGE_START_HERE.md'
      - 'AI_JETSON_TOOL_GUIDE.md'
      - 'External_Work/**'
      - 'hive-pipe/**'
      - 'scripts/install_jetson_gateway.sh'
      - 'scripts/enable_jetson_ssh.sh'
      - 'scripts/jetson_remote.sh'
      - 'scripts/external_work_bridge.py'
      - '.github/workflows/jetson-command.yml'
      - '.github/workflows/jetson-ai-access-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n hive-pipe/agent.sh
          bash -n hive-pipe/install_gateway.sh
          bash -n hive-pipe/install_chatgpt_terminal_pull.sh
          bash -n hive-pipe/install_persistent_relay.sh
          bash -n hive-pipe/install_bridge_lattice_watchdog.sh
          bash -n hive-pipe/bootstrap_chatgpt_terminal_pull.sh

      - name: Python syntax
        run: |
          python3 -m py_compile \
            hive-pipe/gateway.py \
            hive-pipe/mudl.py \
            hive-pipe/terminal_parser.py \
            hive-pipe/chatgpt_terminal_pull.py \
            hive-pipe/bridge_doctor.py \
            hive-pipe/bridge_lattice_watchdog.py \
            hive-pipe/deepseek_bridge.py \
            hive-pipe/deepseek_web_bridge.py \
            scripts/external_work_bridge.py

      - name: Hive Pipe MCP and contract tests\n        run: |\n          set -euo pipefail\n          for t in hive-pipe/test_*.py; do [ -e \"$t\" ] || continue; python3 \"$t\"; done\n      - name: Unified bridge contracts
        run: python3 hive-pipe/bridge_doctor.py --profile ci


      - name: GitHub command lane uses MCP terminal parser
        run: |
          set -euo pipefail
          grep -q '"name": "terminal_run"' .github/workflows/jetson-command.yml
          grep -q ' + "/mcp"' .github/workflows/jetson-command.yml
          if grep -q '/v1/exec' .github/workflows/jetson-command.yml; then
            echo "::error::Jetson Command Lane still references legacy /v1/exec"
            exit 1
          fi
          echo "github -> jetson MCP route: PASS"

name: Independent Bootstrap Validate
on:
  push:
    paths:
      - 'hive-pipe/install_independent_bootstrap.sh'
      - 'hive-pipe/run_bootstrap_supervisor.sh'
      - 'hive-pipe/test_independent_bootstrap.py'
      - '.github/workflows/independent-bootstrap-validate.yml'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n hive-pipe/install_independent_bootstrap.sh hive-pipe/run_bootstrap_supervisor.sh
      - run: python3 hive-pipe/test_independent_bootstrap.py

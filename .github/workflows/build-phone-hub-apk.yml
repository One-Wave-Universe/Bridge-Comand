name: Build One-Wave Phone Hub APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'phone-relay/android/**'
      - '.github/workflows/build-phone-hub-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: phone-relay/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f phone-relay/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum phone-relay/android/app/build/outputs/apk/debug/app-debug.apk | tee phone-hub-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: one-wave-phone-hub-debug-apk
          path: |
            phone-relay/android/app/build/outputs/apk/debug/app-debug.apk
            phone-hub-apk.sha256
          if-no-files-found: error
